[workspace]
resolver = "2"
members = [
  "crates/kernel",
  "crates/cyptos-test",
  "crates/cyptos-test-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/riscv-os"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
